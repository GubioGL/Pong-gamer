[project]
name = "cvjax"
version = "0.1.0"
description = "Small JAX library for continuous-variable quantum neural networks in the Fock basis (CVNeuralNetLayers without a Fock device)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Gubio G. de Lima"}]
dependencies = ["jax>=0.4", "numpy"]

[project.urls]
Homepage = "https://github.com/GubioGL/cvjax"

[project.optional-dependencies]
test = ["pytest", "scipy", "pennylane==0.45.1", "jax==0.7.1", "jaxlib==0.7.1", "thewalrus"]
examples = ["optax"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
